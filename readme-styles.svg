<svg fill="none" width="100%" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:900px;height:380px;">
      <style>
        .banner {
          width: 100%;
          height: 100%;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
          border-radius: 16px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          box-sizing: border-box;
          padding: 32px 40px;
          position: relative;
          overflow: hidden;
        }
        .banner::before {
          content: '';
          position: absolute;
          top: -50%;
          right: -30%;
          width: 600px;
          height: 600px;
          background: radial-gradient(circle, rgba(255,180,84,0.08) 0%, transparent 70%);
          pointer-events: none;
        }
        .banner::after {
          content: '';
          position: absolute;
          bottom: -40%;
          left: -20%;
          width: 500px;
          height: 500px;
          background: radial-gradient(circle, rgba(255,180,84,0.05) 0%, transparent 70%);
          pointer-events: none;
        }
        .logo-wrap {
          display: flex;
          align-items: center;
          gap: 20px;
          margin-bottom: 16px;
          position: relative;
          z-index: 1;
        }
        .logo-text {
          font-size: 48px;
          font-weight: 800;
          color: #FFB454;
          letter-spacing: -1px;
          line-height: 1;
        }
        .logo-badge {
          background: #FFB454;
          color: #1a1a2e;
          font-size: 14px;
          font-weight: 700;
          padding: 4px 12px;
          border-radius: 20px;
          letter-spacing: 0.5px;
          margin-top: 8px;
        }
        .tagline {
          font-size: 18px;
          color: #a0aec0;
          margin: 4px 0 20px 0;
          position: relative;
          z-index: 1;
          text-align: center;
          max-width: 600px;
        }
        .tagline em {
          color: #FFB454;
          font-style: normal;
          font-weight: 600;
        }
        .pill-row {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          justify-content: center;
          position: relative;
          z-index: 1;
        }
        .pill {
          background: rgba(255,180,84,0.12);
          border: 1px solid rgba(255,180,84,0.25);
          color: #FFB454;
          font-size: 13px;
          font-weight: 500;
          padding: 6px 16px;
          border-radius: 20px;
          letter-spacing: 0.3px;
        }
        .pill-muted {
          background: rgba(160,174,192,0.08);
          border: 1px solid rgba(160,174,192,0.15);
          color: #a0aec0;
          font-size: 13px;
          font-weight: 500;
          padding: 6px 16px;
          border-radius: 20px;
          letter-spacing: 0.3px;
        }
      </style>
      <div class="banner">
        <div class="logo-wrap">
          <span class="logo-text">wippa</span>
          <span class="logo-badge">v0.1.0</span>
        </div>
        <div class="tagline">
          <em>One command. Zero config.</em> Data leaves only by your rules.
        </div>
        <div class="pill-row">
          <span class="pill">MIT</span>
          <span class="pill">Docker sandbox</span>
          <span class="pill">gVisor</span>
          <span class="pill-muted">Egress proxy</span>
          <span class="pill-muted">AST scan</span>
          <span class="pill-muted">18 frameworks</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
