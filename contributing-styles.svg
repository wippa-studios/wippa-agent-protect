<svg fill="none" width="100%" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:900px;height:140px;">
      <style>
        .banner {
          width: 100%;
          height: 100%;
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          box-sizing: border-box;
          padding: 24px 40px;
        }
        .content {
          display: flex;
          align-items: center;
          gap: 24px;
        }
        .mark {
          width: 48px;
          height: 48px;
          background: #FFB454;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 24px;
          font-weight: 800;
          color: #1a1a2e;
          flex-shrink: 0;
        }
        .text h1 {
          font-size: 24px;
          font-weight: 700;
          color: #FFB454;
          margin: 0 0 4px 0;
        }
        .text p {
          font-size: 15px;
          color: #a0aec0;
          margin: 0;
        }
      </style>
      <div class="banner">
        <div class="content">
          <div class="mark">W</div>
          <div class="text">
            <h1>Contributing to Wippa</h1>
            <p>We're in early OSS and want to keep the feedback loop tight.</p>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
